<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Dashboard Overview</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-light bg-white shadow-sm mb-5">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{{ url_for('operation') }}"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('operation') }}">Back to Menu</a>
    </div>
  </nav>

  <main class="container">
    <div class="row g-4 text-center">
      <div class="col-md-4">
        <div class="card shadow-sm border-0 h-100 py-4">
          <div class="card-body">
            <div class="text-primary mb-2"><i class="bi bi-table fs-1"></i></div>
            <h6 class="text-muted text-uppercase">Total Rows</h6>
            <h2 class="display-4 fw-bold">{{ stats.Rows if stats else '0' }}</h2>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card shadow-sm border-0 h-100 py-4">
          <div class="card-body">
            <div class="text-success mb-2"><i class="bi bi-layout-three-columns fs-1"></i></div>
            <h6 class="text-muted text-uppercase">Total Columns</h6>
            <h2 class="display-4 fw-bold">{{ stats.Columns if stats else '0' }}</h2>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card shadow-sm border-0 h-100 py-4">
          <div class="card-body">
            <div class="text-danger mb-2"><i class="bi bi-clipboard-data fs-1"></i></div>
            <h6 class="text-muted text-uppercase">Missing Data</h6>
            <h2 class="display-4 fw-bold">{{ stats["Missing Values %"]|default('0') }}%</h2>
          </div>
        </div>
      </div>
    </div>

    <div class="mt-5 text-center">
      <p class="text-muted">Ready for deeper analysis?</p>
      <a href="{{ url_for('eda') }}" class="btn btn-primary btn-lg"><i class="bi bi-search"></i> Go to EDA</a>
    </div>
  </main>
</body>
</html>
